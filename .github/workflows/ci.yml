name: Open Source CI

on:
  push:
    branches: [main, 'product-release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep one current CI run per PR. A new head supersedes queued checks for
  # older commits instead of consuming scarce macOS runner capacity.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new head may supersede stale work; a rerun of an older attempt must not
  # cancel the latest head's CI run.
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  release-staging-audit:
    name: Release audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Open source audit
        run: tools/open_source_audit.sh
      - name: Validate the release tooling
        run: python3 -m py_compile tools/png_text_chunks.py tools/release_sanitize.py tools/release_staging_audit.py tools/release_artifact_audit.py tools/release_chain.py tools/release_manifest.py tools/test_release_sanitize.py tools/test_release_staging_audit.py tools/test_repository_png_controls.py tools/test_release_chain.py tools/test_release_manifest.py
      - name: Show what the tracked tree would add to the manifest
        # Not the verdict -- `check` below is. This prints the exact entry a contributor
        # is missing instead of leaving them with "in neither document", and the empty
        # diff on a fresh checkout is the determinism of `derive` itself.
        run: |
          work="$(mktemp -d)"
          python3 tools/release_manifest.py derive \
            --inputs-out "$work/inputs.json" \
            --exclusions-out "$work/exclusions.json" >/dev/null
          diff -u release/release-inputs-v2.2.x.json "$work/inputs.json" || true
          diff -u release/release-exclusions-v2.2.x.json "$work/exclusions.json" || true
      - name: Manifest and exclusion register are complete
        run: python3 tools/release_manifest.py check
      - name: Build, gate, audit and name the provenance of the staging tree
        run: |
          work="$(mktemp -d)"
          # release_chain owns every file under --work and refuses a round whose run
          # directory holds something it did not create, so the transcript must live outside it.
          transcript="$RUNNER_TEMP/release-chain-transcript.txt"
          set -o pipefail
          python3 tools/release_chain.py --inputs release/release-inputs-v2.2.x.json --exclusions release/release-exclusions-v2.2.x.json --work "$work" | tee "$transcript"
          # The round must be replayable from the commit this checkout names, and the
          # sidecar must know it ran in CI rather than on a laptop.
          grep -q 'inputs_at_commit=True' "$transcript"
          grep -q 'ci=github-actions' "$transcript"
      - name: The chain and both audits must be able to fail
        run: |
          python3 tools/test_release_sanitize.py
          python3 tools/test_release_staging_audit.py
          python3 tools/test_repository_png_controls.py
          python3 tools/test_release_chain.py
          python3 tools/test_release_manifest.py

  localb-core-package:
    name: LOCALB core package tests
    # LOCALBCore is a standalone trust/signing package. Its tests are not part
    # of the app's XCTest target, so keep a direct SwiftPM execution lane.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Derive the LOCALBCore test count
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import re
          root = Path("Packages/LOCALBCore/Tests/LOCALBCoreTests")
          files = sorted(root.glob("*.swift"))
          if not files:
              raise SystemExit("LOCALBCore test source directory is missing or empty")
          count = sum(
              len(re.findall(r"^\s*func test\w+", p.read_text(), re.M))
              for p in files
          )
          if count <= 0:
              raise SystemExit("no LOCALBCore XCTest methods discovered")
          print(f"EXPECTED_CASES={count}")
          print(f"DISCOVERY|Packages/LOCALBCore|files={len(files)} func_test={count}")
          PY
      - name: Run LOCALBCore SwiftPM tests
        run: |
          set -o pipefail
          swift test --package-path Packages/LOCALBCore 2>&1 | tee "$RUNNER_TEMP/localb-core.log"
      - name: Gate on executed LOCALBCore cases
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/localb-core.log" "${EXPECTED_CASES:-}" <<'PY'
          import os, re, sys
          log_path, expected_raw = sys.argv[1], sys.argv[2]
          def out(tag, detail):
              print("GATE|%s|%s" % (tag, detail))
          try:
              expected = int(expected_raw)
          except ValueError:
              expected = 0
          if expected <= 0:
              out("expected_cases", "absent_or_invalid")
              out("verdict", "NO_EXPECTATION")
              sys.exit(1)
          if not os.path.isfile(log_path):
              out("log", "absent")
              out("verdict", "STEP_NOT_STARTED")
              sys.exit(1)
          text = open(log_path, errors="replace").read()
          statuses = re.findall(r"Test Case '[^']*' (passed|failed|skipped) ", text)
          passed = statuses.count("passed")
          failed = statuses.count("failed")
          skipped = statuses.count("skipped")
          executed = passed + failed + skipped
          out("expected_cases", str(expected))
          out("log", "executed=%d passed=%d failed=%d skipped=%d" %
              (executed, passed, failed, skipped))
          if executed == 0:
              for line in [line.strip() for line in text.splitlines() if "error:" in line][:5]:
                  out("blocked_error", line[:220])
              out("verdict", "NO_CASES_EXECUTED")
              sys.exit(1)
          if executed != expected or skipped != 0 or failed != 0:
              out("verdict", "NOT_PASS")
              sys.exit(1)
          out("verdict", "PASS - executed==expected, skipped==0, failed==0")
          PY
      - name: Scope note
        if: always()
        run: |
          echo "SCOPE|Packages/LOCALBCore sources and test target, via native SwiftPM manifest"
          echo "SCOPE|no app integration, transport or real-host claim"

  collection-package:
    name: Transcript collection package
    # MLX-free Swift package. The app links it on the GUI launch path, so a
    # package that stops building or loses cases blocks the product, not only
    # the package. No Xcode project, llama.cpp, model weights, or signing.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Derive the case count this lane must execute
        run: |
          # Positive control: the expectation comes from the tree under test.
          # Fails closed if the directory is missing or holds no test method.
          n=$(grep -rc 'func test' Packages/SimiGoCollection/Tests/SimiGoCollectionTests/*.swift \
              | awk -F: '{s += $2} END {print s + 0}')
          if [ "$n" -le 0 ]; then
            echo "no test methods found under Packages/SimiGoCollection/Tests" >&2
            exit 1
          fi
          echo "EXPECTED_CASES=$n" >> "$GITHUB_ENV"
          echo "DISCOVERY|Packages/SimiGoCollection|func_test=$n"
      - name: Package tests
        run: |
          set -o pipefail
          swift test --package-path Packages/SimiGoCollection 2>&1 | tee "$RUNNER_TEMP/collection-package.log"
      - name: Gate on executed cases, not on the light
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/collection-package.log" "${EXPECTED_CASES:-}" <<'PY'
          import os, re, sys

          log_path, expected_raw = sys.argv[1], sys.argv[2]
          def out(tag, detail):
              print("GATE|%s|%s" % (tag, detail))

          try:
              expected = int(expected_raw)
          except ValueError:
              expected = None
          if not expected or expected <= 0:
              out("expected_cases", "absent_or_invalid (raw=%r)" % expected_raw)
              out("verdict", "NO_EXPECTATION - refusing to judge without a derived count")
              sys.exit(1)

          if not os.path.isfile(log_path):
              out("log", "absent")
              out("verdict", "STEP_NOT_STARTED - the swift test step never produced a log")
              sys.exit(1)
          text = open(log_path, errors="replace").read()
          statuses = re.findall(r"Test Case '[^']*' (passed|failed|skipped) ", text)
          passed = sum(1 for c in statuses if c == "passed")
          failed = sum(1 for c in statuses if c == "failed")
          skipped = sum(1 for c in statuses if c == "skipped")
          executed = passed + failed + skipped
          out("expected_cases", str(expected))
          out("log", "executed=%d passed=%d failed=%d skipped=%d" %
              (executed, passed, failed, skipped))
          if executed == 0:
              for line in [l.strip() for l in text.splitlines() if "error:" in l][:5]:
                  out("blocked_error", line[:220])
              out("verdict", "NO_CASES_EXECUTED - this is not a pass and not a skip")
              sys.exit(1)
          if executed != expected or skipped != 0:
              out("verdict", "UNDEREXECUTED - need executed==%d && skipped==0, got "
                             "executed==%d skipped==%d" % (expected, executed, skipped))
              sys.exit(1)
          if failed != 0:
              out("verdict", "EXECUTED_WITH_FAILURES - %d of %d cases failed" %
                  (failed, expected))
              sys.exit(1)
          out("verdict", "PASS - executed==%d, skipped==0, failed==0" % expected)
          PY
      - name: Scope note
        run: |
          echo "SCOPE|this lane covers Packages/SimiGoCollection only"
          echo "SCOPE|collection-only mode: candidates stay in the inbox; no sink, no IS/ES writes"

  # Blocking remote coverage for P0/P1 answer-demand + MCP behavior and the
  # P2 detached-completion DB assertions. These remain separate from the
  # ExecutionStateGraph witness lane: a green graph test cannot stand in for
  # real HTTP lifecycle/persistence behavior or Runtime migrations.
  macos-p0-p1-app-tests:
    name: macOS P0/P1 HTTP and MCP tests
    # Xcode 27 is required by the pinned MLX dependency for the app test target.
    # The core HTTP/MCP suites run in the default isolated process. LOCALB's real
    # TLS/default-host tests run in a second process with secure mode explicitly set.
    # Both invocations are blocking and independently gate on executed test counts.
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          echo "ARCH=$(uname -m)  IMAGE=$ImageVersion"
      - name: Derive P0/P1 App test counts
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import re

          core_files = [
              Path("SimiGoTests/ChatAnswerReuseHTTPTests.swift"),
              Path("SimiGoTests/ResponsesAnswerReuseHTTPTests.swift"),
              Path("SimiGoTests/MCPInformationSpaceTests.swift"),
              Path("SimiGoTests/CancelPathStubHTTPTests.swift"),
              Path("SimiGoTests/BinaryDownloaderTests.swift"),
              Path("SimiGoTests/SlotActivityTests.swift"),
              Path("SimiGoTests/KVCacheSettingsTests.swift"),
              Path("SimiGoTests/ToolChoiceSelectionTests.swift"),
              Path("SimiGoTests/ResponsesSplitEnvelopeTests.swift"),
              Path("SimiGoTests/SessionAdoptionTests.swift"),
              Path("SimiGoTests/LOCALBManagementEntryTests.swift"),
              Path("SimiGoTests/LOCALBBranchLifecycleTests.swift"),
              Path("SimiGoTests/ProducerIdentityWeightsTests.swift"),
              Path("SimiGoTests/PrefixPoolNamespaceRecencyTests.swift"),
              Path("SimiGoTests/ISKVBindAuthorityTests.swift"),
              Path("SimiGoTests/ResponsesContinuationSettlementContractTests.swift"),
              Path("SimiGoTests/EngineIdentityLedgerTests.swift"),
              Path("SimiGoTests/ResponsesContinuationHTTPIntegrationTests.swift"),
              Path("SimiGoTests/ResponsesContinuationAdmissionGateTests.swift"),
              Path("SimiGoTests/SettlementConsumptionRiskAcceptanceMCPTests.swift"),
              Path("SimiGoTests/NativeMLXContinuationSettlementAdapterTests.swift"),
              Path("SimiGoTests/RequestAdmissionSchedulerTests.swift"),
              Path("SimiGoTests/TurnDigestAssignmentTests.swift"),
              Path("SimiGoTests/TurnDigestReceiptTests.swift"),
              Path("SimiGoTests/TurnDigestRetryTests.swift"),
              Path("SimiGoTests/DigestPrefixSubstitutionTests.swift"),
              Path("SimiGoTests/GGUFManagedEntryHTTPTests.swift"),
              Path("SimiGoTests/HTTPServerLOCALBRoutePolicyTests.swift"),
              Path("SimiGoTests/LOCALBTransportWiringTests.swift"),
          ]
          localb_file = Path("SimiGoTests/LOCALBRequestAuthWiringTests.swift")
          missing = [str(p) for p in [*core_files, localb_file] if not p.is_file()]
          if missing:
              raise SystemExit("missing P0/P1 App test file(s): " + ", ".join(missing))

          def count(path):
              return len(re.findall(r"^\s*func test\w+", path.read_text(), re.M))

          core_count = sum(count(path) for path in core_files)
          localb_count = count(localb_file)
          if core_count <= 0 or localb_count <= 0:
              raise SystemExit("P0/P1 core or LOCALB test discovery returned zero methods")
          print(f"EXPECTED_CORE_CASES={core_count}")
          print(f"EXPECTED_LOCALB_CASES={localb_count}")
          print(f"DISCOVERY|P0/P1 core HTTP/MCP test methods={core_count}")
          print(f"DISCOVERY|LOCALB secure transport test methods={localb_count}")
          PY
      - name: Build P0/P1 HTTP, MCP and LOCALB tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SimiGo.xcodeproj \
            -scheme SimiGo \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/ci-p0-p1 \
            -enableCodeCoverage NO \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SimiGoTests/ChatAnswerReuseHTTPTests \
            -only-testing:SimiGoTests/ResponsesAnswerReuseHTTPTests \
            -only-testing:SimiGoTests/MCPInformationSpaceTests \
            -only-testing:SimiGoTests/CancelPathStubHTTPTests \
            -only-testing:SimiGoTests/BinaryDownloaderTests \
            -only-testing:SimiGoTests/SlotActivityTests \
            -only-testing:SimiGoTests/KVCacheSettingsTests \
            -only-testing:SimiGoTests/ToolChoiceSelectionTests \
            -only-testing:SimiGoTests/ResponsesSplitEnvelopeTests \
            -only-testing:SimiGoTests/SessionAdoptionTests \
            -only-testing:SimiGoTests/SessionEvictionSelectionTests \
            -only-testing:SimiGoTests/SessionOperationLeaseTests \
            -only-testing:SimiGoTests/SessionGenerationGateQuiescenceTests \
            -only-testing:SimiGoTests/SessionGenerationAdmissionTests \
            -only-testing:SimiGoTests/SessionPressureSuspendTests \
            -only-testing:SimiGoTests/SessionEvictionCacheReclaimTests \
            -only-testing:SimiGoTests/LOCALBManagementEntryTests \
            -only-testing:SimiGoTests/LOCALBBranchLifecycleTests \
            -only-testing:SimiGoTests/ProducerIdentityWeightsTests \
            -only-testing:SimiGoTests/PrefixPoolNamespaceRecencyTests \
            -only-testing:SimiGoTests/PrefixSnapshotStoreRestartSafetyTests \
            -only-testing:SimiGoTests/ISKVBindAuthorityTests \
            -only-testing:SimiGoTests/ResponsesContinuationSettlementContractTests \
            -only-testing:SimiGoTests/EngineIdentityLedgerTests \
            -only-testing:SimiGoTests/ResponsesContinuationHTTPIntegrationTests \
            -only-testing:SimiGoTests/ResponsesContinuationAdmissionGateTests \
            -only-testing:SimiGoTests/SettlementConsumptionRiskAcceptanceMCPTests \
            -only-testing:SimiGoTests/NativeMLXContinuationSettlementAdapterTests \
            -only-testing:SimiGoTests/RequestAdmissionSchedulerTests \
            -only-testing:SimiGoTests/TurnDigestAssignmentTests \
            -only-testing:SimiGoTests/TurnDigestReceiptTests \
            -only-testing:SimiGoTests/TurnDigestRetryTests \
            -only-testing:SimiGoTests/DigestPrefixSubstitutionTests \
            -only-testing:SimiGoTests/LOCALBRequestAuthWiringTests \
            -only-testing:SimiGoTests/GGUFEngineClientTests \
            -only-testing:SimiGoTests/GGUFManagedEntryHTTPTests \
            -only-testing:SimiGoTests/HTTPServerLOCALBRoutePolicyTests \
            -only-testing:SimiGoTests/LOCALBTransportWiringTests
      - name: Generate isolated App test xctestrun
        run: |
          set -euo pipefail
          products=".build/ci-p0-p1/Build/Products"
          app="$products/Debug/SimiGo.app"
          isolation="$RUNNER_TEMP/p0-p1-isolation"
          mkdir -p "$isolation/home" "$isolation/cache" "$isolation/state-graph"
          python3 tools/make_isolated_xctestrun.py \
            --app "$app" \
            --isolation-root "$isolation" \
            --record "$RUNNER_TEMP/p0-p1-xctestrun-isolation.json"
          xr="$products/xctestrun_isolated.xctestrun"
          test -f "$xr"
          echo "ISOLATED_XCTESTRUN=$xr" >> "$GITHUB_ENV"
          echo "ISOLATION|fresh root=$isolation"
          echo "ISOLATION|xctestrun=$xr"
      - name: Run isolated core HTTP and MCP XCTest
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$ISOLATED_XCTESTRUN" \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/p0-p1-core.xcresult" \
            -enableCodeCoverage NO \
            -only-testing:SimiGoTests/ChatAnswerReuseHTTPTests \
            -only-testing:SimiGoTests/ResponsesAnswerReuseHTTPTests \
            -only-testing:SimiGoTests/MCPInformationSpaceTests \
            -only-testing:SimiGoTests/CancelPathStubHTTPTests \
            -only-testing:SimiGoTests/BinaryDownloaderTests \
            -only-testing:SimiGoTests/SlotActivityTests \
            -only-testing:SimiGoTests/KVCacheSettingsTests \
            -only-testing:SimiGoTests/ToolChoiceSelectionTests \
            -only-testing:SimiGoTests/ResponsesSplitEnvelopeTests \
            -only-testing:SimiGoTests/SessionAdoptionTests \
            -only-testing:SimiGoTests/SessionEvictionSelectionTests \
            -only-testing:SimiGoTests/SessionOperationLeaseTests \
            -only-testing:SimiGoTests/SessionGenerationGateQuiescenceTests \
            -only-testing:SimiGoTests/SessionGenerationAdmissionTests \
            -only-testing:SimiGoTests/SessionPressureSuspendTests \
            -only-testing:SimiGoTests/SessionEvictionCacheReclaimTests \
            -only-testing:SimiGoTests/LOCALBManagementEntryTests \
            -only-testing:SimiGoTests/LOCALBBranchLifecycleTests \
            -only-testing:SimiGoTests/ProducerIdentityWeightsTests \
            -only-testing:SimiGoTests/PrefixPoolNamespaceRecencyTests \
            -only-testing:SimiGoTests/PrefixSnapshotStoreRestartSafetyTests \
            -only-testing:SimiGoTests/ISKVBindAuthorityTests \
            -only-testing:SimiGoTests/ResponsesContinuationSettlementContractTests \
            -only-testing:SimiGoTests/EngineIdentityLedgerTests \
            -only-testing:SimiGoTests/ResponsesContinuationHTTPIntegrationTests \
            -only-testing:SimiGoTests/ResponsesContinuationAdmissionGateTests \
            -only-testing:SimiGoTests/SettlementConsumptionRiskAcceptanceMCPTests \
            -only-testing:SimiGoTests/NativeMLXContinuationSettlementAdapterTests \
            -only-testing:SimiGoTests/RequestAdmissionSchedulerTests \
            -only-testing:SimiGoTests/TurnDigestAssignmentTests \
            -only-testing:SimiGoTests/TurnDigestReceiptTests \
            -only-testing:SimiGoTests/TurnDigestRetryTests \
            -only-testing:SimiGoTests/DigestPrefixSubstitutionTests \
            -only-testing:SimiGoTests/GGUFEngineClientTests \
            -only-testing:SimiGoTests/GGUFManagedEntryHTTPTests \
            -only-testing:SimiGoTests/HTTPServerLOCALBRoutePolicyTests \
            -only-testing:SimiGoTests/LOCALBTransportWiringTests \
            2>&1 | tee "$RUNNER_TEMP/p0-p1-core.log"
      - name: Generate isolated secure LOCALB App test xctestrun
        run: |
          set -euo pipefail
          products=".build/ci-p0-p1/Build/Products"
          app="$products/Debug/SimiGo.app"
          isolation="$RUNNER_TEMP/p0-p1-isolation"
          python3 tools/make_isolated_xctestrun.py \
            --app "$app" \
            --isolation-root "$isolation" \
            --base-xctestrun "$ISOLATED_XCTESTRUN" \
            --out "$products/xctestrun_localb_secure.xctestrun" \
            --record "$RUNNER_TEMP/p0-p1-localb-secure-isolation.json" \
            --secure-localb
          xr="$products/xctestrun_localb_secure.xctestrun"
          test -f "$xr"
          echo "ISOLATED_LOCALB_XCTESTRUN=$xr" >> "$GITHUB_ENV"
          echo "ISOLATION|secure LOCALB xctestrun=$xr"
      - name: Run LOCALB request authorization in secure mode
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$ISOLATED_LOCALB_XCTESTRUN" \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/p0-p1-localb-secure.xcresult" \
            -enableCodeCoverage NO \
            -only-testing:SimiGoTests/LOCALBRequestAuthWiringTests \
            2>&1 | tee "$RUNNER_TEMP/p0-p1-localb-secure.log"
      - name: Gate both isolated test invocations and xcresult counts
        if: always()
        run: |
          python3 - \
            "$RUNNER_TEMP/p0-p1-core.log" \
            "$RUNNER_TEMP/p0-p1-core.xcresult" \
            "${EXPECTED_CORE_CASES:-}" \
            "$RUNNER_TEMP/p0-p1-localb-secure.log" \
            "$RUNNER_TEMP/p0-p1-localb-secure.xcresult" \
            "${EXPECTED_LOCALB_CASES:-}" <<'PY'
          import json, os, re, subprocess, sys

          def out(tag, detail):
              print("GATE|%s|%s" % (tag, detail))

          def validate(label, log_path, bundle_path, expected_raw):
              ok = True
              try:
                  expected = int(expected_raw)
              except ValueError:
                  expected = 0
              out(label + "_expected_cases", str(expected))
              if expected <= 0:
                  out(label + "_verdict", "NO_EXPECTATION")
                  return False
              if not os.path.isfile(log_path):
                  out(label + "_log", "absent")
                  out(label + "_verdict", "STEP_NOT_STARTED")
                  return False

              text = open(log_path, errors="replace").read()
              statuses = re.findall(r"Test Case '[^']*' (passed|failed|skipped) ", text)
              passed = statuses.count("passed")
              failed = statuses.count("failed")
              skipped = statuses.count("skipped")
              executed = passed + failed + skipped
              out(label + "_log", "executed=%d passed=%d failed=%d skipped=%d" %
                  (executed, passed, failed, skipped))
              if executed == 0:
                  for line in [x.strip() for x in text.splitlines() if "error:" in x][:5]:
                      out(label + "_blocked_error", line[:220])
                  out(label + "_verdict", "BUILD_BLOCKED_OR_NO_CASES_EXECUTED")
                  return False

              aggregate = re.findall(
                  r"Executed (\d+) tests?, with (?:(\d+) tests? skipped and )?(\d+) failures?",
                  text
              )
              if not aggregate:
                  out(label + "_aggregate", "missing Executed summary")
                  out(label + "_verdict", "NO_AGGREGATE")
                  return False
              a_exec, a_skip, a_fail = (int(x or 0) for x in aggregate[-1])
              out(label + "_aggregate", "executed=%d failed=%d skipped=%d" %
                  (a_exec, a_fail, a_skip))
              # XCTest's aggregate "failures" counts individual assertion issues,
              # while "Test Case ... failed" counts failed test methods. One method
              # can emit several assertion failures, so compare execution/skip counts
              # exactly and compare failure presence rather than unlike quantities.
              if a_exec != executed or a_skip != skipped or ((a_fail == 0) != (failed == 0)):
                  out(label + "_verdict", "LOG_COUNT_DISAGREEMENT")
                  return False

              if not os.path.isdir(bundle_path):
                  out(label + "_xcresult", "bundle_absent")
                  out(label + "_verdict", "NO_RESULT_BUNDLE")
                  return False
              raw = subprocess.run(
                  ["xcrun", "xcresulttool", "get", "test-results", "summary", "--path", bundle_path],
                  capture_output=True, text=True, timeout=120
              )
              if raw.returncode != 0 or not raw.stdout.strip():
                  out(label + "_xcresult", "unreadable rc=%s" % raw.returncode)
                  out(label + "_verdict", "NO_XCRESULT_SUMMARY")
                  return False
              data = json.loads(raw.stdout)
              found = []
              stack = [data]
              while stack:
                  node = stack.pop()
                  if isinstance(node, dict):
                      counts = {
                          k.lower().replace("tests", ""): v
                          for k, v in node.items()
                          if isinstance(v, int) and not isinstance(v, bool)
                      }
                      if {"passed", "failed", "skipped"} <= set(counts):
                          found.append(counts)
                      stack.extend(node.values())
                  elif isinstance(node, list):
                      stack.extend(node)
              if not found:
                  out(label + "_xcresult", "no passed/failed/skipped count object")
                  out(label + "_verdict", "NO_XCRESULT_COUNTS")
                  return False
              xc = max(found, key=lambda x: x["passed"] + x["failed"] + x["skipped"])
              x_exec = xc["passed"] + xc["failed"] + xc["skipped"]
              out(label + "_xcresult", json.dumps(xc, sort_keys=True))
              if (x_exec, xc["failed"], xc["skipped"]) != (executed, failed, skipped):
                  out(label + "_verdict", "LOG_XCRESULT_DISAGREEMENT")
                  return False
              if executed != expected or skipped != 0 or failed != 0:
                  out(label + "_verdict", "NOT_PASS")
                  return False
              out(label + "_verdict", "PASS - executed==expected, skipped==0, failed==0")
              return True

          core_ok = validate("core", sys.argv[1], sys.argv[2], sys.argv[3])
          localb_ok = validate("localb_secure", sys.argv[4], sys.argv[5], sys.argv[6])
          out("overall_verdict", "PASS" if core_ok and localb_ok else "NOT_PASS")
          sys.exit(0 if core_ok and localb_ok else 1)
          PY
      - name: Scope note
        if: always()
        run: |
          echo "SCOPE|ChatAnswerReuseHTTPTests + MCPInformationSpaceTests + CancelPathStubHTTPTests run in the default isolated process"
          echo "SCOPE|ProducerIdentityWeightsTests (local and hub snapshot content identity, no network) runs in the same default process"
          echo "SCOPE|PrefixPoolNamespaceRecencyTests + PrefixSnapshotStoreRestartSafetyTests cover LRU, disk rescan, and symlink-safety regressions"
          echo "SCOPE|includes four-path detached settlement DB assertions and negative controls"
          echo "SCOPE|LOCALBRequestAuthWiringTests run separately with SIMIGO_TRANSPORT=secure"
          echo "SCOPE|no claim about external models, third-party agent clients, or end-to-end Agent execution"
  real-mlx-kv-restore-smoke:
    name: Real MLX governed KV restore smoke (Qwen3 0.6B)
    # The stock xcode-27 runner cannot host the 17.2 GB production 30B model.
    # This pinned 335 MB Qwen3 MLX model executes the same real NativeMLX /
    # settlement / disk-pool path; it is a smoke, not 30B performance evidence.
    #
    # Manual trigger only (owner ruling 2026-11-16): a resident macOS runner
    # must not be spent on every ordinary PR. This is a COST ruling, not a
    # health claim. At the commit that landed it this lane was KNOWN RED on one
    # assertion — see "Real-MLX lane status" in the PR body. Do not read an
    # all-green PR check list as covering governed KV restore on a real model.
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain and runner capacity
        run: |
          xcodebuild -version
          swift --version
          df -h .
          sysctl hw.memsize
      - name: Download pinned real MLX model
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hf-download"
          "$RUNNER_TEMP/hf-download/bin/python" -m pip install --disable-pip-version-check "huggingface_hub==0.36.0"
          "$RUNNER_TEMP/hf-download/bin/python" - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          model = snapshot_download(
              repo_id="mlx-community/Qwen3-0.6B-4bit",
              revision="73e3e38d981303bc594367cd910ea6eb48349da8",
              cache_dir=os.path.join(os.environ["RUNNER_TEMP"], "hf-cache"),
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "mlx-qwen3-0.6b-4bit"),
          )
          assert os.path.isfile(os.path.join(model, "config.json")), model
          assert any(name.endswith(".safetensors") for name in os.listdir(model)), model
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("CONTINUATION_MODEL_PATH=" + model + "\n")
          print("REAL_MLX_MODEL|repo=mlx-community/Qwen3-0.6B-4bit|path=" + model)
          PY
      - name: Build real-model governed KV test host
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SimiGo.xcodeproj \
            -scheme SimiGo \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/real-mlx-kv \
            -enableCodeCoverage NO \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SimiGoTests/GovernedContinuationKVRestoreRealModelE2ETests/testGovernedContinuationRestoresSettledKVAcrossExecutionStates \
            -only-testing:SimiGoTests/GovernedContinuationKVRestoreRealModelE2ETests/testZGovernedContinuationRefusesTamperedPoolDeclaration
      # ONE isolation root PER CASE, on purpose — do not fold these back into a
      # single --expected-cases 2 invocation. Both cases stage an anchor that
      # settles to `RESULT=<token>` and then ask the model to echo it; the
      # positive case commits that exchange to the Information Space, and a
      # shared SIMIGO_HOME lets the tamper case's Turn 1 retrieve it
      # (observed: `[IS] contextInject bytes=4059` where the positive case's own
      # Turn 1 injected `bytes=0`). The 0.6B model then echoes the OTHER case's
      # token and the result contract refuses it with
      # PRODUCER_RESULT_BINDING_MISMATCH — a 422 that reads like a settlement
      # defect but is the two cases sharing one memory. Verified 2026-11-16:
      # the tamper case passes alone and fails second. The fresh root is part of
      # the procedure here exactly as it is for testF3DeviceAcceptanceBattery.
      - name: Execute real-model governed KV restore in a fresh isolated root
        run: |
          tools/run_isolated_tests.sh \
            --app "$GITHUB_WORKSPACE/build/real-mlx-kv/Build/Products/Debug/SimiGo.app" \
            --evidence-dir "$GITHUB_WORKSPACE/build/real-mlx-kv-isolation-restore" \
            --tag qwen3-0_6b-governed-kv-restore \
            --destination 'platform=macOS,arch=arm64' \
            --expected-cases 1 \
            --continuation-model "$CONTINUATION_MODEL_PATH" \
            --prefix-pool \
            --only-testing SimiGoTests/GovernedContinuationKVRestoreRealModelE2ETests/testGovernedContinuationRestoresSettledKVAcrossExecutionStates
      - name: Execute real-model tamper rejection in a second fresh isolated root
        run: |
          tools/run_isolated_tests.sh \
            --app "$GITHUB_WORKSPACE/build/real-mlx-kv/Build/Products/Debug/SimiGo.app" \
            --evidence-dir "$GITHUB_WORKSPACE/build/real-mlx-kv-isolation-tamper" \
            --tag qwen3-0_6b-governed-kv-tamper \
            --destination 'platform=macOS,arch=arm64' \
            --expected-cases 1 \
            --continuation-model "$CONTINUATION_MODEL_PATH" \
            --prefix-pool \
            --only-testing SimiGoTests/GovernedContinuationKVRestoreRealModelE2ETests/testZGovernedContinuationRefusesTamperedPoolDeclaration
      - name: State the model coverage boundary
        if: always()
        run: |
          echo "SCOPE|two real MLX governed KV restore / tamper tests ran against pinned Qwen3-0.6B-4bit"
          echo "SCOPE|this does not establish the 30B target model's cache behavior or performance"

  runtime-contract-tests:
    name: SimiGoRuntime contract tests (isolated source target)
    # SwiftPM currently builds the package's MLX experimental target even when
    # filtering to RuntimeContractTests. Build the exact RuntimeContract source
    # and test files in a temporary minimal package, with no MLX dependency.
    # This proves the contract sources/tests execute on this toolchain, but is
    # not a build of the full SimiGoRuntime package manifest/products.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          echo "ARCH=$(uname -m)  IMAGE=$ImageVersion"
      - name: Assemble isolated Runtime Contract package
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/simigo-runtime-contract-package"
          mkdir -p "$package/Sources/SimiGoRuntimeContract"
          mkdir -p "$package/Tests/SimiGoRuntimeContractTests"
          cp -R Packages/SimiGoRuntime/Sources/SimiGoRuntimeContract/. \
            "$package/Sources/SimiGoRuntimeContract/"
          cp -R Packages/SimiGoRuntime/Tests/SimiGoRuntimeContractTests/. \
            "$package/Tests/SimiGoRuntimeContractTests/"
          cat > "$package/Package.swift" <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "SimiGoRuntimeContractCI",
              platforms: [.macOS(.v14)],
              products: [
                  .library(name: "SimiGoRuntimeContract", targets: ["SimiGoRuntimeContract"])
              ],
              targets: [
                  .target(
                      name: "SimiGoRuntimeContract",
                      linkerSettings: [.linkedLibrary("sqlite3")]
                  ),
                  .testTarget(
                      name: "SimiGoRuntimeContractTests",
                      dependencies: ["SimiGoRuntimeContract"]
                  )
              ]
          )
          SWIFT
          python3 - "$package" >> "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import re, sys
          package = Path(sys.argv[1])
          tests = package / "Tests/SimiGoRuntimeContractTests"
          files = sorted(tests.glob("*.swift"))
          if not files:
              raise SystemExit("isolated Runtime Contract test source is absent")
          count = sum(
              len(re.findall(r"^\s*func test\w+", p.read_text(), re.M))
              for p in files
          )
          if count <= 0:
              raise SystemExit("no Runtime Contract test methods discovered")
          print(f"RUNTIME_PACKAGE={package}")
          print(f"EXPECTED_CASES={count}")
          print(f"DISCOVERY|isolated SimiGoRuntimeContractTests|func_test={count}")
          print(f"DISCOVERY|test_files={len(files)}")
          PY
          echo "ISOLATION|copied exact RuntimeContract source and tests; no Experimental target or MLX package dependency"
      - name: Run isolated Runtime Contract tests
        run: |
          set -o pipefail
          swift test --package-path "$RUNTIME_PACKAGE" 2>&1 | tee "$RUNNER_TEMP/runtime-contract.log"
      - name: Gate on executed Runtime cases
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/runtime-contract.log" "${EXPECTED_CASES:-}" <<'PY'
          import os, re, sys

          log_path, expected_raw = sys.argv[1:3]
          def out(tag, detail):
              print("GATE|%s|%s" % (tag, detail))
          try:
              expected = int(expected_raw)
          except ValueError:
              expected = 0
          if expected <= 0:
              out("expected_cases", "absent_or_invalid")
              out("verdict", "NO_EXPECTATION")
              sys.exit(1)
          if not os.path.isfile(log_path):
              out("log", "absent")
              out("verdict", "STEP_NOT_STARTED")
              sys.exit(1)
          text = open(log_path, errors="replace").read()
          statuses = re.findall(r"Test Case '[^']*' (passed|failed|skipped) ", text)
          passed = statuses.count("passed")
          failed = statuses.count("failed")
          skipped = statuses.count("skipped")
          executed = passed + failed + skipped
          out("expected_cases", str(expected))
          out("log", "executed=%d passed=%d failed=%d skipped=%d" %
              (executed, passed, failed, skipped))
          aggregate = re.findall(
              r"Executed (\d+) tests?, with (?:(\d+) tests? skipped and )?(\d+) failures?",
              text
          )
          if executed == 0 or not aggregate:
              out("verdict", "NO_CASES_EXECUTED_OR_NO_AGGREGATE")
              sys.exit(1)
          a_exec, a_skip, a_fail = (int(x or 0) for x in aggregate[-1])
          out("aggregate", "executed=%d failed=%d skipped=%d" % (a_exec, a_fail, a_skip))
          if (a_exec, a_fail, a_skip) != (executed, failed, skipped):
              out("verdict", "LOG_COUNT_DISAGREEMENT")
              sys.exit(1)
          if executed != expected or skipped != 0 or failed != 0:
              out("verdict", "NOT_PASS")
              sys.exit(1)
          out("verdict", "PASS - executed==expected, skipped==0, failed==0")
          PY
      - name: Scope note
        if: always()
        run: |
          echo "SCOPE|exact SimiGoRuntimeContract source and test files, compiled in an isolated minimal SwiftPM package"
          echo "SCOPE|does not build the full SimiGoRuntime package manifest or SimiGo2Experimental/MLX target"
          echo "SCOPE|no claim about external models or model E2E"

  # Blocking execution-evidence lane on the GA Xcode 27 toolchain. The gate
  # requires executed == expected && skipped == 0 && failed == 0; a runner that
  # never starts cannot be mistaken for a test pass.
  macos-tests-supported-toolchain:
    name: macOS targeted tests (supported toolchain)
    # macos-26 ships Swift 6.3.3 and cannot compile the pinned mlx-swift-lm
    # revision. Xcode 27 is GA and provides the required toolchain.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          echo "ARCH=$(uname -m)  IMAGE=$ImageVersion"
      - name: Derive the case count this lane must execute
        run: |
          # Positive control: the expectation comes from the tree under test, so a
          # lane that executes nothing cannot pass by matching a stale constant.
          # Fails closed on exit if the class is missing or holds no test method.
          n=$(grep -c 'func test' SimiGoTests/ExecutionStateGraphTests.swift)
          echo "EXPECTED_CASES=$n" >> "$GITHUB_ENV"
          echo "DISCOVERY|SimiGoTests/ExecutionStateGraphTests|func_test=$n"
      - name: Targeted Execution State tests (supported toolchain)
        run: |
          set -o pipefail
          xcodebuild test \
            -project SimiGo.xcodeproj \
            -scheme SimiGo \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/ci-x27 \
            -resultBundlePath "$RUNNER_TEMP/esg-x27.xcresult" \
            -enableCodeCoverage NO \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SimiGoTests/ExecutionStateGraphTests 2>&1 | tee "$RUNNER_TEMP/esg-x27.log"
      - name: Gate on executed / skipped, not on the light
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/esg-x27.log" "$RUNNER_TEMP/esg-x27.xcresult" "${EXPECTED_CASES:-}" <<'PY'
          import json, os, re, subprocess, sys

          log_path, bundle_path, expected_raw = sys.argv[1], sys.argv[2], sys.argv[3]
          def out(tag, detail):
              print("GATE|%s|%s" % (tag, detail))

          try:
              expected = int(expected_raw)
          except ValueError:
              expected = None
          if not expected or expected <= 0:
              out("expected_cases", "absent_or_invalid (raw=%r)" % expected_raw)
              out("verdict", "NO_EXPECTATION - refusing to judge without a derived count")
              sys.exit(1)
          out("expected_cases", str(expected))

          if not os.path.isfile(log_path):
              out("log", "absent")
              out("verdict", "STEP_NOT_STARTED - the xcodebuild step never produced a log")
              sys.exit(1)
          text = open(log_path, errors="replace").read()
          lines = text.splitlines()

          # Per-case lines, not the suite summary: "with N failures" counts
          # assertion failures, which is not the same number as failing cases.
          # Unanchored on purpose - a real xcodebuild log starts these lines with
          # "Test Case '-[Module.Class test]' <status>", and a downloaded Actions
          # export prefixes job/step/timestamp columns before the same text.
          statuses = re.findall(r"Test Case '[^']*' (passed|failed|skipped) ", text)
          passed = sum(1 for c in statuses if c == "passed")
          failed = sum(1 for c in statuses if c == "failed")
          skipped = sum(1 for c in statuses if c == "skipped")
          executed = passed + failed + skipped
          build_blocked = ("Testing cancelled because the build failed" in text or
                           "** TEST FAILED **" in text) and executed == 0
          out("log", "executed=%d passed=%d failed=%d skipped=%d build_blocked=%s" %
              (executed, passed, failed, skipped, build_blocked))
          # Third source, using the same summary line the repo's own isolation
          # harness parses (tools/run_isolated_tests.sh): if the per-case lines and
          # the suite summary disagree on executed or failed, that is a failure of
          # this gate, not a tie-break. Skipped is printed from both and not
          # asserted, because the summary's own skipped accounting differs.
          agg = re.findall(r"Executed (\d+) tests?, with (?:(\d+) tests? skipped and )?"
                           r"(\d+) failures?", text)
          if agg:
              a_exec, a_skip, a_fail = (int(v or 0) for v in agg[-1])
              out("aggregate", "last=executed=%d failed=%d skipped=%d occurrences=%d" %
                  (a_exec, a_fail, a_skip, len(agg)))
              if (a_exec, a_fail) != (executed, failed):
                  out("verdict", "COUNTS_DISAGREE - per-case lines (%d/%d) and the "
                                 "Executed summary (%d/%d) disagree on executed/failed" %
                      (executed, failed, a_exec, a_fail))
                  sys.exit(1)
          else:
              out("aggregate", "no Executed summary line in this log")
          # Only surfaced when nothing ran: a runtime log full of harmless
          # "error:" substrings must never be printed next to a PASS verdict.
          if executed == 0:
              for line in [l.strip() for l in lines if "error:" in l][:5]:
                  out("blocked_error", line[:220])

          # Authoritative counts when the result bundle is readable. Both sources
          # are printed; a disagreement is its own failure rather than a tie-break.
          xc = None
          if os.path.exists(bundle_path):
              try:
                  raw = subprocess.run(
                      ["xcrun", "xcresulttool", "get", "test-results", "summary",
                       "--path", bundle_path],
                      capture_output=True, text=True, timeout=120)
                  data = json.loads(raw.stdout) if raw.returncode == 0 and raw.stdout.strip() else None
              except Exception as exc:
                  data, raw = None, None
                  out("xcresulttool", "raised %s" % exc)
              if isinstance(data, dict):
                  def counts(d):
                      k = {x.lower().replace("tests", ""): v for x, v in d.items()
                           if isinstance(v, int) and not isinstance(v, bool)}
                      return k if {"passed", "failed", "skipped"} <= set(k) else None
                  found = []
                  stack = [data]
                  while stack:
                      node = stack.pop()
                      if isinstance(node, dict):
                          c = counts(node)
                          if c:
                              found.append((c, node))
                          stack.extend(node.values())
                      elif isinstance(node, list):
                          stack.extend(node)
                  if found:
                      pick = max(found, key=lambda t: sum(t[0].values()))[1]
                      xc = {k.lower().replace("tests", ""): pick.get(k) for k in pick
                            if isinstance(pick.get(k), int)}
                      out("xcresulttool", json.dumps(xc, sort_keys=True))
                  else:
                      out("xcresulttool", "bundle read but no integer count object")
              else:
                  out("xcresulttool", "unreadable (rc=%s) - falling back to log counts" %
                      (raw.returncode if raw is not None else "n/a"))
          else:
              out("xcresulttool", "absent - falling back to log counts")
          if xc is not None:
              x_exec = sum(int(v or 0) for k, v in xc.items() if k in ("passed", "failed", "skipped"))
              if (x_exec, int(xc.get("failed") or 0), int(xc.get("skipped") or 0)) != \
                 (executed, failed, skipped):
                  out("verdict", "COUNTS_DISAGREE - log and result bundle disagree; "
                                 "refusing to pick one")
                  sys.exit(1)
              source = "log+xcresulttool"
          else:
              source = "log"
          out("counts_source", source)

          if build_blocked:
              out("verdict", "BUILD_BLOCKED - zero cases executed; this is not a pass "
                             "and not a skip")
              sys.exit(1)
          if executed != expected or skipped != 0:
              out("verdict", "UNDEREXECUTED - need executed==%d && skipped==0, got "
                             "executed==%d skipped==%d" % (expected, executed, skipped))
              sys.exit(1)
          if failed != 0:
              out("verdict", "EXECUTED_WITH_FAILURES - %d of %d cases failed" %
                  (failed, expected))
              sys.exit(1)
          out("verdict", "PASS - executed==%d, skipped==0, failed==0 (source=%s)" %
              (expected, source))
          PY
      - name: Scope note
        run: |
          echo "SCOPE|this lane covers SimiGoTests/ExecutionStateGraphTests only"
          echo "SCOPE|no SimiGoRuntime contract suite and no llama.cpp-gated target runs here"
          # Derived from the file, not asserted from memory: which jobs can still
          # fail the whole run.
          awk '/^jobs:$/{injobs=1;next}
               injobs && /^  [a-zA-Z0-9_-]+:$/{job=$1; sub(/:$/,"",job); order[++n]=job}
               injobs && /^    continue-on-error: true/{nb[job]=1}
               END{for(i=1;i<=n;i++){j=order[i]; printf "BLOCKING|%s|%s\n", j, (j in nb ? "non-blocking" : "blocking")}}' \
            .github/workflows/ci.yml

