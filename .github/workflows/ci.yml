name: Open Source CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Open source audit
        run: tools/open_source_audit.sh

  macos-tests:
    name: macOS targeted tests
    # SimiGo's local public-build toolchain is Xcode 27, but hosted macos-27
    # is not yet available to this repository. Keep Xcode 26 visible while
    # non-blocking until its pinned dependency compatibility is resolved.
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'macosx|DriverKit' || true
          swift --version
      - name: Targeted Execution State tests
        run: |
          xcodebuild test \
            -project SimiGo.xcodeproj \
            -scheme SimiGo \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci \
            -enableCodeCoverage NO \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SimiGoTests/ExecutionStateGraphTests
